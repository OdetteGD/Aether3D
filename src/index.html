<!doctype html>

<html
  lang="en"
>

<head>

  <meta
    charset="utf-8"
  />



  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
  />



  <meta
    name="theme-color"
    content="#07090D"
  />



  <meta
    http-equiv="Content-Security-Policy"
    content="default-src 'self' data: blob:; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' https: wss:; worker-src 'self' blob:;"
  />



  <title>
    Aether3D Studio
  </title>

</head>



<body>

  <main
    id="aether3d-app"
    aria-label="Aether3D Studio"
  >

    <canvas
      id="viewport"
      aria-label="Aether3D 3D workspace"
    ></canvas>



    <section
      id="hud"
      aria-live="polite"
    >

      <div
        id="brand"
      >
        AETHER3D STUDIO
      </div>



      <div
        id="status"
      >
        Native viewport initializing…
      </div>



      <div
        id="version"
      >
        Physics Core: connecting…
      </div>



      <pre
        id="telemetry"
      ></pre>

    </section>

  </main>



  <script
    src="./aether3d.bundle.js"
    defer
  ></script>



</body>

</html>
