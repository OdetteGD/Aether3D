name: Aether3D Native Android Build



on:

  push:

    branches:

      - main



  workflow_dispatch:



permissions:

  contents: read



jobs:

  build:

    name: Build production debug APK

    runs-on: ubuntu-24.04

    timeout-minutes: 45



    steps:

      - name: Checkout repository

        uses: actions/checkout@v6



      - name: Set up JDK 17

        uses: actions/setup-java@v5

        with:

          distribution: temurin

          java-version: "17"



      - name: Set up Node.js 18

        uses: actions/setup-node@v5

        with:

          node-version: "18"

          package-manager-cache: false



      - name: Set up Gradle

        uses: gradle/actions/setup-gradle@v6

        with:

          gradle-version: "9.4.1"

          cache-disabled: true



      - name: Configure Android SDK environment

        run: |

          set -euo pipefail



          export ANDROID_SDK_ROOT="/usr/local/lib/android/sdk"

          export ANDROID_HOME="/usr/local/lib/android/sdk"



          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"

          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"



          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"



          if [ ! -x "$SDKMANAGER" ]; then

            SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print | sort -V | tail -n 1)"

          fi



          test -x "$SDKMANAGER"



          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"

          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"



          "$SDKMANAGER" --version



      - name: Install Android SDK and NDK toolchains

        run: |

          set -euo pipefail



          sdkmanager --sdk_root="$ANDROID_SDK_ROOT" "platform-tools" "platforms;android-36" "build-tools;36.0.0" "cmake;3.22.1" "ndk;28.2.13676358"



          yes | sdkmanager --sdk_root="$ANDROID_SDK_ROOT" --licenses >/dev/null 2>&1 || true



          test -d "$ANDROID_SDK_ROOT/ndk/28.2.13676358"

          test -d "$ANDROID_SDK_ROOT/cmake/3.22.1"



          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/28.2.13676358" >> "$GITHUB_ENV"



      - name: Provision official Mono Android runtime
        run: |
          set -euo pipefail

          DOTNET_DIR="$RUNNER_TEMP/dotnet"
          DOTNET_INSTALL="$RUNNER_TEMP/dotnet-install.sh"

          curl -fsSL "https://dot.net/v1/dotnet-install.sh" -o "$DOTNET_INSTALL"
          chmod +x "$DOTNET_INSTALL"
          "$DOTNET_INSTALL" --channel 10.0 --install-dir "$DOTNET_DIR" --no-path

          export DOTNET_ROOT="$DOTNET_DIR"
          export PATH="$DOTNET_ROOT:$PATH"

          echo "DOTNET_ROOT=$DOTNET_ROOT" >> "$GITHUB_ENV"
          echo "$DOTNET_ROOT" >> "$GITHUB_PATH"

          dotnet --info

          dotnet workload install android --skip-manifest-update

          JNI_ROOT="app/src/main/jniLibs"
          rm -rf "$JNI_ROOT"
          mkdir -p "$JNI_ROOT/arm64-v8a" "$JNI_ROOT/armeabi-v7a" "$JNI_ROOT/x86_64"

          find "$DOTNET_ROOT" "$HOME/.dotnet" -type f -name "libmonosgen-2.0.so" -print 2>/dev/null | sort -u > "$RUNNER_TEMP/monosgen-files.txt"
          test -s "$RUNNER_TEMP/monosgen-files.txt"

          copy_mono_for_abi() {
            local abi="$1"
            local runtime_abi="$2"
            local destination="$JNI_ROOT/$abi/libmonosgen-2.0.so"
            local source=""

            while IFS= read -r candidate; do
              if printf '%s\\n' "$candidate" | grep -Eq "/android-$runtime_abi/|/$runtime_abi/|/$(printf '%s' "$abi" | sed 's/-//g')/"; then
                source="$candidate"
                break
              fi
            done < "$RUNNER_TEMP/monosgen-files.txt"

            if [ -z "$source" ]; then
              echo "::error::Could not locate libmonosgen-2.0.so for ABI $abi (runtime id android-$runtime_abi)."
              cat "$RUNNER_TEMP/monosgen-files.txt"
              exit 1
            fi

            cp "$source" "$destination"
            test -s "$destination"
            echo "Packaged Mono runtime: $destination"
            file "$destination"
          }

          copy_mono_for_abi "arm64-v8a" "arm64"
          copy_mono_for_abi "armeabi-v7a" "arm"
          copy_mono_for_abi "x86_64" "x64"

          echo "Official Mono runtime libraries staged for Android packaging."


      - name: Self-healing Android directory verification

        run: |

          set -euo pipefail



          mkdir -p "app/src/main/java/com/aether3d/studio"

          mkdir -p "app/src/main/assets/www"

          mkdir -p "app/src/main/cpp"

          mkdir -p "app/src/main/res/values"

          mkdir -p "gradle/wrapper"

          mkdir -p "web-dist"



          required_files=(

            "settings.gradle"

            "build.gradle"

            "gradle.properties"

            "app/build.gradle"

            "app/src/main/AndroidManifest.xml"

            "app/src/main/java/com/aether3d/studio/MainActivity.java"

            "app/src/main/cpp/CMakeLists.txt"

            "app/src/main/cpp/native-lib.cpp"

            "src/index.html"

            "src/index.js"

            "package.json"

            "webpack.config.js"

          )



          for file_path in "${required_files[@]}"; do

            if [ ! -s "$file_path" ]; then

              echo "::error::Required source file is missing or empty: $file_path"

              exit 1

            fi

          done



          if [ -f "config.xml" ]; then

            echo "::error::Cordova config.xml is still present."

            exit 1

          fi



          if [ -d "src/android" ]; then

            echo "::error::Legacy Cordova src/android directory is still present."

            exit 1

          fi



          if [ -d "src/native" ]; then

            echo "::error::Legacy src/native directory is still present."

            exit 1

          fi



          if [ -f "auto-run.js" ]; then

            echo "::error::Legacy local auto-run.js is still present."

            exit 1

          fi



      - name: Install JavaScript dependencies and build web bundle

        run: |

          set -euo pipefail



          npm install

          npm run build



          test -s "web-dist/aether3d.bundle.js"



          cp "src/index.html" "web-dist/index.html"



          test -s "web-dist/index.html"



      - name: Install bundled web assets into native APK asset bank

        run: |

          set -euo pipefail



          rm -rf "app/src/main/assets/www"

          mkdir -p "app/src/main/assets/www"



          cp -R "web-dist/." "app/src/main/assets/www/"



          test -s "app/src/main/assets/www/index.html"

          test -s "app/src/main/assets/www/aether3d.bundle.js"



          grep -F '<script' "app/src/main/assets/www/index.html"
          grep -F 'aether3d.bundle.js' "app/src/main/assets/www/index.html"



      - name: Generate Gradle Wrapper in the cloud

        run: |

          set -euo pipefail



          gradle wrapper --gradle-version 9.4.1 --distribution-type bin



          chmod +x "./gradlew"



          test -s "./gradlew"



          ./gradlew --version



      - name: Assemble Android debug APK

        run: |

          set -euo pipefail



          ./gradlew assembleDebug --stacktrace --no-daemon --console=plain



      - name: Verify APK output

        run: |

          set -euo pipefail



          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"



          test -s "$APK_PATH"



          mkdir -p "artifacts"

          cp "$APK_PATH" "artifacts/app-debug.apk"



          sha256sum "artifacts/app-debug.apk"



      - name: Verify packaged native shared libraries
        run: |
          set -euo pipefail



          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"



          for abi in arm64-v8a armeabi-v7a x86_64; do

            echo "Checking lib/aether3d_physics.so for $abi"

            unzip -l "$APK_PATH" | grep -F "lib/$abi/libaether3d_physics.so"

          done



          echo "Native Aether3D .so packaging verified."



      - name: Verify packaged Mono runtime shared libraries
        run: |
          set -euo pipefail

          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"

          for abi in arm64-v8a armeabi-v7a x86_64; do
            echo "Checking lib/\\$abi/libmonosgen-2.0.so for Mono runtime"
            unzip -l "$APK_PATH" | grep -F "lib/\\$abi/libmonosgen-2.0.so"
          done

          echo "Mono libmonosgen-2.0.so packaging verified for all configured ABIs."


      - name: Upload app-debug.apk

        uses: actions/upload-artifact@v6

        with:

          name: aether3d-native-app-debug

          path: artifacts/app-debug.apk

          if-no-files-found: error
