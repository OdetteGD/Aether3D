name: Aether3D Android Build
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: "18"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK and NDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" "cmake;3.22.1" "ndk;27.2.12479018"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - name: Install JavaScript dependencies
        run: npm install --legacy-peer-deps
      - name: Build and obfuscate editor bundle
        run: npm run build
      - name: Prepare Cordova Android platform
        run: npx cordova platform add android@13.0.0 --no-telemetry
      - name: Build debug APK
        env:
          CORDOVA_JAVA_HOME: ${{ env.JAVA_HOME }}
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}
        run: npx cordova build android --debug --no-telemetry
      - name: Locate APK
        run: |
          mkdir -p artifacts
          APK=$(find platforms/android/app/build/outputs/apk -type f -name "*debug*.apk" | head -n 1)
          test -n "$APK"
          cp "$APK" artifacts/app-debug.apk
      - name: Upload app-debug.apk
        uses: actions/upload-artifact@v4
        with:
          name: aether3d-app-debug
          path: artifacts/app-debug.apk
          if-no-files-found: error
