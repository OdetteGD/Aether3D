name: Aether3D Android Build
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Set up Node.js 18
        uses: actions/setup-node@v5
        with:
          node-version: "18"
      - name: Configure Android SDK
        env:
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print | sort -V | tail -n 1)"
          fi
          test -x "$SDKMANAGER"
          export PATH="$(dirname "$SDKMANAGER"):$ANDROID_SDK_ROOT/platform-tools:$PATH"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          "$SDKMANAGER" --version
          yes | "$SDKMANAGER" --licenses >/dev/null || true
      - name: Install Android SDK and NDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" "cmake;3.22.1" "ndk;27.2.12479018"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - name: Install JavaScript dependencies
        run: npm install --legacy-peer-deps
      - name: Build and obfuscate editor bundle
        run: npm run build
      - name: Build native C++20 shared libraries
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}
        run: |
          set -euo pipefail
          rm -rf src/android/jniLibs
          for ABI in arm64-v8a armeabi-v7a x86_64; do
            BUILD_DIR="${RUNNER_TEMP}/aether3d-cmake-${ABI}"
            rm -rf "$BUILD_DIR"
            cmake -S src/native -B "$BUILD_DIR" \
              -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
              -DANDROID_ABI="$ABI" \
              -DANDROID_PLATFORM=android-24 \
              -DCMAKE_BUILD_TYPE=Release
            cmake --build "$BUILD_DIR" --target aether3d_core --parallel 2
            mkdir -p "src/android/jniLibs/$ABI"
            cp "$BUILD_DIR/libaether3d_core.so" "src/android/jniLibs/$ABI/libaether3d_core.so"
          done
      - name: Prepare Cordova Android platform
        run: npx cordova platform add android@13.0.0 --no-telemetry
      - name: Build debug APK
        env:
          CORDOVA_JAVA_HOME: ${{ env.JAVA_HOME }}
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}
        run: npx cordova build android --debug --no-telemetry
      - name: Locate APK
        run: |
          mkdir -p artifacts
          APK=$(find platforms/android/app/build/outputs/apk -type f -name "*debug*.apk" | head -n 1)
          test -n "$APK"
          cp "$APK" artifacts/app-debug.apk
      - name: Upload app-debug.apk
        uses: actions/upload-artifact@v4
        with:
          name: aether3d-app-debug
          path: artifacts/app-debug.apk
          if-no-files-found: error
