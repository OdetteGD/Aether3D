name: Aether3D Native Android Build



on:

  push:

    branches:

      - main



  workflow_dispatch:



permissions:

  contents: read



jobs:

  build:

    name: Build production debug APK

    runs-on: ubuntu-24.04

    timeout-minutes: 45



    steps:

      - name: Checkout repository

        uses: actions/checkout@v6



      - name: Set up JDK 17

        uses: actions/setup-java@v5

        with:

          distribution: temurin

          java-version: "17"



      - name: Set up Node.js 18

        uses: actions/setup-node@v5

        with:

          node-version: "18"



      - name: Set up Gradle

        uses: gradle/actions/setup-gradle@v6

        with:

          gradle-version: "9.4.1"



      - name: Configure Android SDK environment

        run: |

          set -euo pipefail



          export ANDROID_SDK_ROOT="/usr/local/lib/android/sdk"

          export ANDROID_HOME="/usr/local/lib/android/sdk"



          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"

          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"



          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"



          if [ ! -x "$SDKMANAGER" ]; then

            SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print | sort -V | tail -n 1)"

          fi



          test -x "$SDKMANAGER"



          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"

          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"



          "$SDKMANAGER" --version



      - name: Install Android SDK and NDK toolchains

        run: |

          set -euo pipefail



          yes | sdkmanager --licenses >/dev/null || true



          sdkmanager 
            "platform-tools" 
            "platforms;android-36" 
            "build-tools;36.0.0" 
            "cmake;3.22.1" 
            "ndk;28.2.13676358"



          yes | sdkmanager --licenses >/dev/null || true



          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/28.2.13676358" >> "$GITHUB_ENV"



      - name: Self-healing Android directory verification

        run: |

          set -euo pipefail



          mkdir -p 
            "app/src/main/java/com/aether3d/studio" 
            "app/src/main/assets/www" 
            "app/src/main/cpp" 
            "app/src/main/res/values" 
            "app/src/main/res/mipmap-hdpi" 
            "app/src/main/res/mipmap-mdpi" 
            "app/src/main/res/mipmap-xhdpi" 
            "app/src/main/res/mipmap-xxhdpi" 
            "app/src/main/res/mipmap-xxxhdpi" 
            "gradle/wrapper" 
            "web-dist"



          required_files=(

            "settings.gradle"

            "build.gradle"

            "gradle.properties"

            "app/build.gradle"

            "app/src/main/AndroidManifest.xml"

            "app/src/main/java/com/aether3d/studio/MainActivity.java"

            "app/src/main/cpp/CMakeLists.txt"

            "app/src/main/cpp/native-lib.cpp"

            "src/index.html"

            "src/index.js"

            "package.json"

            "webpack.config.js"

          )



          for file_path in "${required_files[@]}"; do

            if [ ! -s "$file_path" ]; then

              echo "::error::Required source file is missing or empty: $file_path"

              exit 1

            fi

          done



          test ! -f "config.xml"

          test ! -f "auto-run.js"



      - name: Install JavaScript dependencies and build web bundle

        run: |

          set -euo pipefail



          npm install



          npm run build



      - name: Install bundled web assets into native APK asset bank

        run: |

          set -euo pipefail



          rm -rf "app/src/main/assets/www"



          mkdir -p "app/src/main/assets/www"



          cp -R "web-dist/." "app/src/main/assets/www/"



          test -s "app/src/main/assets/www/index.html"

          test -s "app/src/main/assets/www/aether3d.bundle.js"



          if grep -R "cordova.js" "app/src/main/assets/www"; then

            echo "::error::Cordova asset detected in native Android web assets."

            exit 1

          fi



      - name: Generate Gradle Wrapper in the cloud

        run: |

          set -euo pipefail



          gradle wrapper 
            --gradle-version 9.4.1 
            --distribution-type bin



          chmod +x "./gradlew"



          ./gradlew --version



      - name: Assemble Android debug APK

        run: |

          set -euo pipefail



          ./gradlew assembleDebug 
            --stacktrace 
            --no-daemon 
            --console=plain



      - name: Verify APK output

        run: |

          set -euo pipefail



          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"



          test -s "$APK_PATH"



          mkdir -p "artifacts"



          cp "$APK_PATH" "artifacts/app-debug.apk"



          sha256sum "artifacts/app-debug.apk"



      - name: Upload app-debug.apk

        uses: actions/upload-artifact@v6

        with:

          name: aether3d-native-app-debug

          path: artifacts/app-debug.apk

          if-no-files-found: error
